name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@1acf10fef155895b7441ad432e6d42b2a0be5e6e
        with:
          dev-shell: ""
          command: |
            nix run .#check
            version=$(sed -n 's/^return "\(.*\)"$/\1/p' lua/input_grader/version.lua)
            test "v${version}" = "${GITHUB_REF_NAME}"
            nix run .#package
            tools/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - run: gh release create "${GITHUB_REF_NAME}" "build/input-grader-${GITHUB_REF_NAME#v}.zip" --title "Input grader ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
